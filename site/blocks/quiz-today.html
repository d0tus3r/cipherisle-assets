<script>/* today's play file by the visitor's own date (GitHub can start the daily job hours late), else play.json */
window.ciPlay=window.ciPlay||function(src){var d=new Date(),p=function(n){return (n<10?'0':'')+n},day=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()),dated=src.replace(/play\.json$/,'play-'+day+'.json');var get=function(u){return fetch(u,{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()})};return get(dated).catch(function(){return get(src)})};</script>
<!-- cipherisle.com home page: today's three questions (Forgotten Word, Fact of the Day, Today in History) as
     tappable cards. Reads today/play.json "quiz" from d0tus3r/cipherisle-assets (written nightly with the same
     questions as the day's images and Shorts). No outside scripts; the answers you pick stay in this browser. -->
<style>
.ci-quiz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:.4em 0 1.6em;text-align:center}
.ci-quiz *{box-sizing:border-box}
.ci-quiz .q{display:flex;flex-direction:column;border:1px solid rgba(226,184,101,.55);background:linear-gradient(180deg,#16213A,#0B1220);padding:18px 14px 16px}
.ci-quiz .t{color:#E2B865;font-family:'IM Fell English SC',Georgia,serif;letter-spacing:.08em;font-size:1rem;margin:0}
.ci-quiz .dt{color:#B9C4CF;font-style:italic;font-size:.85rem;margin:.1em 0 .8em}
.ci-quiz .big{color:#E4E0D6;font-size:clamp(1.4rem,2.6vw,2rem);line-height:1.12;margin:0 0 .2em}
.ci-quiz .sub{color:#B9C4CF;font-style:italic;font-size:.95rem;margin:0 0 .2em}
.ci-quiz .pr{color:#E2B865;font-size:1.05rem;margin:.3em 0 .7em}
.ci-quiz button.o{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;margin:0 0 8px;padding:.55em .8em;border:1px solid rgba(185,196,207,.45);
 border-radius:6px;background:rgba(22,33,58,.7);color:#E4E0D6;font:1.02rem/1.3 'IM Fell English',Georgia,serif;cursor:pointer;min-height:44px}
.ci-quiz button.o b{color:#E2B865;font-weight:400}
.ci-quiz button.o:hover:not([disabled]){border-color:#E2B865;background:rgba(226,184,101,.12)}
.ci-quiz button.o[disabled]{cursor:default}
.ci-quiz button.o.right{border-color:#E2B865;background:rgba(226,184,101,.25)}
.ci-quiz button.o.wrong{border-color:#FF8A80;background:rgba(255,138,128,.12);color:#FFCFC9}
.ci-quiz .res{min-height:1.3em;margin:.5em 0 0;font-size:1rem;color:#E4E0D6}
.ci-quiz .res b{color:#E2B865;font-weight:400;font-family:'IM Fell English SC',Georgia,serif;letter-spacing:.06em}
.ci-quiz .res i{display:block;color:#B9C4CF;font-size:.95rem;margin-top:.25em}
.ci-quiz .peek{margin-top:auto;padding-top:.6em;background:none;border:0;color:#B9C4CF;font:italic .9rem Georgia,serif;cursor:pointer;text-decoration:underline}
@media (max-width:800px){.ci-quiz{grid-template-columns:1fr;max-width:460px;margin-left:auto;margin-right:auto}}
</style>
<div class="ci-quiz" id="ciQuiz"><p style="grid-column:1/-1;color:#B9C4CF;font-style:italic">Loading today's questions…</p></div>
<script>
(function(){
 var SRC='https://raw.githubusercontent.com/d0tus3r/cipherisle-assets/main/today/play.json', box=document.getElementById('ciQuiz');
 function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
 function card(q,date){
  var k='ciquiz:'+date+':'+q.name, picked=null; try{picked=localStorage.getItem(k)}catch(e){}
  var c=el('div','q'); c.appendChild(el('p','t',q.title));
  c.appendChild(el('p','dt',new Date(date+'T12:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})));
  c.appendChild(el('p','big',q.big)); if(q.sub)c.appendChild(el('p','sub',q.sub)); if(q.prompt)c.appendChild(el('p','pr',q.prompt));
  var btns=[], res=el('div','res'), peek=el('button','peek','Just show me the answer');
  function reveal(i,quiet){btns.forEach(function(b,j){b.disabled=true;if(j==q.answer)b.classList.add('right');else if(j==i)b.classList.add('wrong')});
   res.innerHTML=''; var h=el('b',null,i==null?'The answer':(i==q.answer?'Right!':'Not quite')); res.appendChild(h);
   if(i!=null&&i!=q.answer)res.appendChild(document.createTextNode(' It was '+'ABCD'[q.answer]+'.'));
   if(q.note&&q.note!=q.options[q.answer])res.appendChild(el('i',null,q.note)); peek.style.display='none';
   if(!quiet){try{localStorage.setItem(k,i==null?'peek':String(i))}catch(e){}}}
  q.options.forEach(function(o,i){var b=el('button','o');b.type='button';b.appendChild(el('b',null,'ABCD'[i]+'.'));b.appendChild(el('span',null,o));
   b.onclick=function(){reveal(i)};btns.push(b);c.appendChild(b)});
  c.appendChild(res); peek.type='button'; peek.onclick=function(){reveal(null)}; c.appendChild(peek);
  if(picked!=null)reveal(picked=='peek'?null:Number(picked),true);
  return c}
 ciPlay(SRC).then(function(d){
  box.innerHTML=''; (d.quiz||[]).forEach(function(q){box.appendChild(card(q,d.date))});
  if(!(d.quiz||[]).length)box.innerHTML='<p style="grid-column:1/-1;color:#B9C4CF">No questions today. Come back tomorrow.</p>'})
 .catch(function(){box.innerHTML='<p style="grid-column:1/-1;color:#B9C4CF">Today\'s questions didn\'t load. Try again in a moment.</p>'});
})();
</script>
